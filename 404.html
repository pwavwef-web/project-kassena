<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Page not found — Project Kasena" />
  <meta name="theme-color" content="#063d2b" />
  <title>404 — Page Not Found | Project Kasena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --green-950: #062f23;
      --green-900: #073d2b;
      --green-800: #0b5139;
      --green-700: #146446;
      --gold-600: #c98b1b;
      --gold-500: #d9a323;
      --gold-300: #f0cf72;
      --cream-100: #fbf5e8;
      --cream-200: #f3ead8;
      --ink: #10231c;
      --muted: #607168;
      --white: #ffffff;
      --shadow: 0 24px 70px rgba(6, 47, 35, 0.16);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream-100);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* ── Nav ── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(251, 245, 232, 0.9);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(6, 47, 35, 0.08);
    }

    .nav-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green-950);
    }

    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      object-fit: cover;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 13px 20px;
      font-weight: 800;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
      border: 0;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold-500), var(--gold-600));
      color: #211306;
      box-shadow: 0 16px 34px rgba(201, 139, 27, 0.24);
    }

    .btn-outline {
      border: 1px solid rgba(6, 47, 35, 0.18);
      color: var(--green-950);
      background: rgba(255, 255, 255, 0.58);
    }

    /* ── 404 main area ── */
    .not-found {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 80px 0;
      background:
        radial-gradient(circle at top left, rgba(217, 163, 35, 0.22), transparent 34%),
        linear-gradient(135deg, #fff8ea 0%, #f5ead2 42%, #e8d2af 100%);
    }

    .not-found::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(6, 47, 35, 0.04) 1px, transparent 1px),
        linear-gradient(rgba(6, 47, 35, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, #000, transparent 70%);
      pointer-events: none;
    }

    .not-found-inner {
      position: relative;
      text-align: center;
      max-width: 600px;
    }

    .error-code {
      font-size: clamp(5rem, 20vw, 12rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.07em;
      color: var(--green-950);
      margin: 0 0 8px;
    }

    .error-code span {
      background: linear-gradient(135deg, var(--gold-500), var(--gold-600));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      border: 1px solid rgba(6, 47, 35, 0.13);
      background: rgba(255, 255, 255, 0.62);
      color: var(--green-900);
      padding: 8px 13px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 28px;
    }

    .not-found h1 {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      line-height: 1.15;
      letter-spacing: -0.04em;
      margin: 0 0 16px;
      color: var(--green-950);
    }

    .not-found p {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 0 0 36px;
    }

    .not-found-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    /* ── Footer ── */
    footer {
      background: var(--green-950);
      color: rgba(255, 255, 255, 0.7);
      padding: 28px 0;
      font-size: 0.88rem;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    footer strong {
      color: var(--white);
    }

    footer a {
      color: var(--gold-300);
    }

    footer a:hover {
      color: var(--gold-500);
    }

    @media (max-width: 600px) {
      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <nav class="nav" aria-label="Main navigation">
    <div class="container nav-inner">
      <a class="brand" href="/" aria-label="Project Kasena home">
        <img src="/assets/project-kasena-logo.png" alt="Project Kasena logo" />
        <span>Project Kasena</span>
      </a>
    </div>
  </nav>

  <main class="not-found" aria-labelledby="error-heading">
    <div class="not-found-inner container">
      <div class="eyebrow">Page not found</div>
      <p class="error-code"><span>404</span></p>
      <h1 id="error-heading">This path doesn't exist — yet.</h1>
      <p>
        The page you're looking for may have moved or never existed.<br>
        Let's get you back to building the digital future of Kasem.
      </p>
      <div class="not-found-actions">
        <a class="btn btn-primary" href="/">Go to homepage</a>
        <a class="btn btn-outline" href="mailto:francis@azlearner.me">Contact us</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="container footer-inner">
      <div><strong>Project Kasena</strong> — Digitizing Our Heritage</div>
      <div>© <span id="year"></span>
        <a href="https://franci.azlearner.me" target="_blank"> Francis Pwavwe.</a>
        All rights reserved.
      </div>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
